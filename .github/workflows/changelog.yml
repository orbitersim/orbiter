name: Update Changelog on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  update-changelog:
    # Only run if the PR was actually merged, not just closed without merging
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow writes to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to get the commit message

      - name: Append merge commit message to Changelog
        # PR text is passed through the environment so that the shell never parses it
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # in case the file doesn't exist
          touch CHANGELOG.md

          # prepend to changelog; printf %s keeps backslashes in PR text literal
          {
            printf '## PR #%s: %s\n\nCommit: %s\n\n%s\n\n' "$PR_NUMBER" "$PR_TITLE" "$MERGE_COMMIT" "$PR_BODY"
            cat CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit and Push changes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit --allow-empty -m "docs: update CHANGELOG.md for PR #$PR_NUMBER [skip ci]"
          git push origin HEAD:main
