name: Update Changelog on PR

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'CHANGELOG.md' # avoid infinite loop when pushing this

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }} # Check out the actual head branch of the PR, not the merge preview
          fetch-depth: 0 # Fetch all history to get the commit message

      - name: Append merge commit message to Changelog
        run: |
          # in case the file doesn't exist
          touch CHANGELOG.md

          # extract commit details
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"
          
          # prepend to changelog
          echo -e "## PR #$PR_NUMBER: $PR_TITLE\n\nCommit: $MERGE_COMMIT\n\n$PR_BODY\n\n$(cat CHANGELOG.md)" > CHANGELOG.md

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit --allow-empty -m "docs: update CHANGELOG.md for PR #${{ github.event.pull_request.number }} [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
